name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Install JAX with CPU backend (critical for grad/jit)
          pip install --upgrade "jax[cpu]"
          
          pip install -r requirements.txt || true
          pip install -e .[dev]

      - name: Run tests
        run: |
          cd tests
          pytest .
